name: MCRealTime
version: '${project.version}'
main: ing.applecraft.mcrealtime.MCRealTimePlugin
prefix: MCRealTime
authors: [Gabriel M.]
description: Synchronizes Minecraft world time with civil or astronomical real time.
website: https://github.com/AppleCrafting/MCRealTime

commands:
  mcrealtime:
    description: Shows MCRealTime status and administration commands.
    usage: /<command> [status|info|reload]
    aliases: [mcrt]

permissions:
  mcrealtime.use:
    description: Allows access to MCRealTime status information.
    default: true
  mcrealtime.admin:
    description: Allows administrative MCRealTime commands.
    default: op
