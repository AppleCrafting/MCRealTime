# MCRealTime 5 configuration
#
# CLOCK: maps the configured civil clock directly to the Minecraft 24,000-tick day.
# SOLAR: maps local sunrise -> tick 0, solar noon -> 6000 and sunset -> 12000.
#
# The timezone is still required in SOLAR mode to determine the local calendar date.
# Sunrise/sunset themselves are calculated from latitude and longitude.

config-version: 5
enabled: true
mode: CLOCK

timezone: "UTC"

solar:
  # Example coordinates only. Change them before enabling SOLAR mode.
  latitude: 0.0
  longitude: 0.0

# If global is true, all loaded worlds are synchronized.
# Otherwise, only the named worlds are affected.
global: true
worlds:
  - world

synchronization:
  # 20 ticks = approximately one second on a healthy server.
  interval-ticks: 20

behavior:
  # Prevent vanilla sleeping from briefly skipping the night before MCRealTime corrects it.
  prevent-sleep: true

  # When available on the server version, disable the insomnia gamerule while
  # MCRealTime controls a world. The previous value is restored afterwards.
  disable-insomnia: true
